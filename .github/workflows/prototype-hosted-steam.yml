name: Prototype - Steam client on GitHub-hosted runner
# Throwaway investigation, not part of real CI. Issue 06 follow-up question: does the Steam
# client (needed for SteamAPI_Init(), not just steamcmd - see docs/adr/0001-ci-headless-test-runner.md)
# need the elaborate self-hosted setup (pid:host/network:host/host-side-gamer-user bridging in
# CiRunner/docker-compose.yml), or was that actually working around Docker's own nested-user-namespace
# confinement specifically - something a GitHub-hosted runner, being a real VM and not a container,
# might not hit at all?
#
# This step deliberately touches NO Steam credentials - it only asks whether bubblewrap (what the
# Steam client's own sandbox needs) can initialize here, isolating the sandboxing question from the
# separate, harder-to-answer Steam Guard/anti-fraud-on-a-rotating-IP question a real login would raise.
# Delete this workflow once the investigation concludes either way.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    # Needed to reach STEAM_CI_USERNAME/STEAM_CONFIG_VDF for the login attempt below - same
    # cached-session secrets dual-branch-test.yml already uses, no new credentials introduced.
    environment: steam-ci
    steps:
      - name: Check / relax unprivileged user namespace restriction
        run: |
          echo "before:"; sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "after:"; sysctl kernel.apparmor_restrict_unprivileged_userns || true

      - name: Test bare bubblewrap user namespace (no Steam yet)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / -- echo "bwrap userns OK"

      - name: Install Steam client + deps
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ca-certificates curl dbus-x11
          echo steam steam/question select "I AGREE" | sudo debconf-set-selections
          curl --retry 5 --retry-delay 5 -fsSL -o /tmp/steam.deb "http://media.steampowered.com/client/installer/steam.deb"
          sudo apt-get install -y -qq /tmp/steam.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq steam-libs-amd64 steam-libs-i386 xdg-desktop-portal xdg-desktop-portal-gtk

      # First run only self-updates (~500MB) and never reaches a login prompt - let that finish
      # on its own before attempting login, instead of racing it with a short timeout.
      - name: First launch - let the client self-update, no login yet
        run: |
          Xvfb :2 -screen 0 1024x768x16 &
          sleep 2
          DISPLAY=:2 timeout 120 steam -silent || true
          pkill -9 -f 'steam' || true
          sleep 2

      # Same config.vdf secret dual-branch-test.yml restores for steamcmd, but at the GUI
      # client's own config path (~/.local/share/Steam/config/config.vdf - confirmed from the
      # first run's bootstrap log: "Setting up Steam content in /home/runner/.local/share/Steam").
      # No password given - the whole point is finding out whether the cached session token in
      # config.vdf is enough on its own, same as it already is for steamcmd's +login.
      - name: Restore cached Steam session for the client
        run: |
          mkdir -p "$HOME/.local/share/Steam/config"
          printf '%s' "${{ secrets.STEAM_CONFIG_VDF }}" > "$HOME/.local/share/Steam/config/config.vdf"

      - name: Second launch - attempt cached-session login
        run: |
          pgrep -f Xvfb >/dev/null || (Xvfb :2 -screen 0 1024x768x16 & sleep 2)
          DISPLAY=:2 steam -login "${{ secrets.STEAM_CI_USERNAME }}" -silent > /tmp/steam-login.log 2>&1 &
          steam_pid=$!
          # First real launch of a session (steam.sh wrapper does its own update-check + bwrap/
          # pressure-vessel container setup before invoking the actual client binary) took ~1m45s
          # just to reach "Starting login" in the previous prototype run - budget for that plus
          # actual login/network time, not just the login itself.
          for i in $(seq 1 60); do
            sleep 5
            if grep -qE "Received logon success response|SetLoginState: Success|Start offline" "$HOME/.steam/steam/logs/steamui_login.txt" 2>/dev/null; then
              break
            fi
          done
          sleep 3
          echo "--- processes ---"
          ps aux | grep -i steam || true
          pkill -9 -f 'steam' || true

      - name: Show login result
        if: always()
        run: |
          echo "=== steamui_login.txt ==="
          cat "$HOME/.steam/steam/logs/steamui_login.txt" 2>/dev/null || echo "(missing)"
          echo "=== connection_log.txt (tail 60) ==="
          tail -n 60 "$HOME/.steam/steam/logs/connection_log.txt" 2>/dev/null || echo "(missing)"
          echo "=== stdout/stderr from launch ==="
          cat /tmp/steam-login.log 2>/dev/null || echo "(missing)"
